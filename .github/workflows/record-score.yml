name: Record game score

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: quiet-drift-score-writes
  cancel-in-progress: false

jobs:
  record:
    if: contains(github.event.issue.body, '<!-- quiet-drift-score -->')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and record score
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- quiet-drift-score -->\\s*```json\\s*([\\s\\S]*?)\\s*```/);
            if (!match) core.setFailed('Score payload is missing.');
            if (!match) return;

            let submission;
            try { submission = JSON.parse(match[1]); }
            catch { core.setFailed('Score payload is not valid JSON.'); return; }

            const username = String(submission.username || '').trim();
            const score = Number(submission.score);
            if (!/^[A-Za-z0-9 _-]{2,20}$/.test(username)) {
              core.setFailed('Username must contain 2–20 allowed characters.'); return;
            }
            if (!Number.isInteger(score) || score < 0 || score > 999999) {
              core.setFailed('Score must be a whole number between 0 and 999999.'); return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.repos.getContent({ owner, repo, path: 'scores.json', ref: 'main' });
            const board = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
            if (!Array.isArray(board.scores)) board.scores = [];
            board.scores.push({
              username,
              score,
              github_user: context.actor,
              submitted_at: new Date().toISOString(),
              issue: context.issue.number
            });
            board.scores.sort((a, b) => b.score - a.score || a.submitted_at.localeCompare(b.submitted_at));
            board.scores = board.scores.slice(0, 100);

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'scores.json', branch: 'main',
              message: `Record score: ${username} — ${score}`,
              content: Buffer.from(JSON.stringify(board, null, 2) + '\\n').toString('base64'),
              sha: current.data.sha
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: `Score saved: **${username} — ${score}**. The leaderboard will refresh after Pages redeploys.`
            });
            await github.rest.issues.update({ owner, repo, issue_number: context.issue.number, state: 'closed' });
