<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Quiet Drift</title>
  <meta name="description" content="A tiny, quiet reflex game for spare minutes." />
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #697386;
      --line: #dce2eb;
      --paper: #ffffff;
      --wash: #f5f7fb;
      --blue: #3766e8;
      --blue-soft: #e8eeff;
      --red: #d24d57;
      --shadow: 0 18px 50px rgba(24, 36, 62, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        linear-gradient(rgba(55, 102, 232, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(55, 102, 232, .035) 1px, transparent 1px),
        var(--wash);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .shell {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .mark {
      width: 26px; height: 26px; border-radius: 8px;
      display: grid; place-items: center;
      color: white; background: var(--ink);
      font-size: 13px; font-weight: 800;
    }
    h1 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
    .status { font-size: .78rem; color: var(--muted); }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fafbfe;
      border-bottom: 1px solid var(--line);
    }
    .score-box { padding: 12px 18px; }
    .score-box + .score-box { border-left: 1px solid var(--line); }
    .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; }
    .value { margin-top: 2px; font-size: 1.25rem; font-weight: 750; font-variant-numeric: tabular-nums; }

    .game-wrap { padding: 16px; }
    .board {
      position: relative;
      aspect-ratio: 1 / 1.08;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fbfcff;
      overflow: hidden;
      outline: none;
      touch-action: none;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      padding: 28px;
      background: rgba(251, 252, 255, .9);
      backdrop-filter: blur(4px);
      text-align: center;
      transition: opacity .15s ease;
    }
    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 290px; }
    .kicker { color: var(--blue); font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h2 { margin: 9px 0 8px; font-size: 1.6rem; letter-spacing: -.035em; }
    .overlay p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-size: .94rem; }
    button {
      border: 0; border-radius: 10px;
      font: inherit; font-weight: 750;
      cursor: pointer;
    }
    .primary { padding: 11px 20px; color: white; background: var(--blue); box-shadow: 0 6px 16px rgba(55,102,232,.22); }
    .primary:hover { background: #2e59d2; }
    .primary:focus-visible, .control:focus-visible { outline: 3px solid rgba(55,102,232,.24); outline-offset: 2px; }

    .footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 0 18px 16px;
      color: var(--muted); font-size: .78rem;
    }
    .keys { display: flex; gap: 5px; align-items: center; }
    kbd {
      min-width: 25px; padding: 4px 6px;
      background: #fff; border: 1px solid #cfd6e1; border-bottom-width: 2px;
      border-radius: 6px; color: var(--ink); font: 700 .72rem/1 monospace;
      text-align: center;
    }
    .control { background: transparent; color: var(--muted); padding: 6px 8px; }
    .control:hover { color: var(--ink); background: #f0f3f8; }

    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 60px);
      justify-content: center;
      gap: 7px;
      padding: 0 18px 16px;
    }
    .touch-controls button {
      height: 52px; color: var(--ink); background: #f0f3f8;
      border: 1px solid var(--line); font-size: 1rem;
    }
    .touch-controls .up { grid-column: 2; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 620px) {
      body { padding: 0; background: var(--paper); place-items: start center; }
      .shell { width: 100%; min-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
      .game-wrap { padding: 12px 14px; }
      .board { aspect-ratio: 1 / 1; }
      .touch-controls { display: grid; }
      .footer { padding-bottom: 12px; }
      .keys { display: none; }
    }

    @media (pointer: coarse) and (min-width: 700px) and (orientation: landscape) {
      body { padding: 12px; place-items: center; background: var(--wash); }
      .shell {
        width: min(100%, 880px); min-height: 0;
        display: grid; grid-template-columns: minmax(0, 1fr) 190px;
        border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      }
      header, .scores { grid-column: 1 / -1; }
      .game-wrap { grid-column: 1; grid-row: 3 / 6; padding: 12px; }
      .board { height: min(68svh, 520px); width: min(68svh, 520px); margin: auto; }
      .touch-controls { grid-column: 2; grid-row: 3; align-self: center; padding: 18px 10px 8px; }
      .footer { grid-column: 2; grid-row: 4; justify-content: center; align-self: start; padding: 0 12px 18px; }
    }

    @media (prefers-reduced-motion: reduce) { .overlay { transition: none; } }
  </style>
</head>
<body>
  <main class="shell" aria-label="Quiet Drift game">
    <header>
      <div class="brand"><div class="mark">QD</div><h1>Quiet Drift</h1></div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="scores" aria-label="Scoreboard">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">000</div></div>
      <div class="score-box"><div class="label">Best</div><div class="value" id="best">000</div></div>
    </section>

    <div class="game-wrap">
      <div class="board" id="board" tabindex="0" aria-label="Game board. Use arrow keys or WASD to move.">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="kicker" id="kicker">A 30-second escape</div>
            <h2 id="title">Stay in the clear.</h2>
            <p id="message">Drag the blue tile or use the arrow pad. Avoid the red notes. The pace picks up as your score climbs.</p>
            <button class="primary" id="start">Start round</button>
          </div>
        </div>
      </div>
    </div>

    <div class="touch-controls" aria-label="Touch movement controls">
      <button class="up" data-dir="up" aria-label="Move up">↑</button>
      <button class="left" data-dir="left" aria-label="Move left">←</button>
      <button class="down" data-dir="down" aria-label="Move down">↓</button>
      <button class="right" data-dir="right" aria-label="Move right">→</button>
    </div>

    <footer class="footer">
      <div class="keys"><kbd>WASD</kbd><span>or</span><kbd>↑↓←→</kbd></div>
      <button class="control" id="pause">Pause · P</button>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const board = document.getElementById('board');
      const overlay = document.getElementById('overlay');
      const title = document.getElementById('title');
      const kicker = document.getElementById('kicker');
      const message = document.getElementById('message');
      const startBtn = document.getElementById('start');
      const pauseBtn = document.getElementById('pause');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const statusEl = document.getElementById('status');

      let width = 0, height = 0, raf = 0, last = 0;
      let running = false, paused = false, score = 0, spawnClock = 0, elapsed = 0;
      let best = Number(localStorage.getItem('quiet-drift-best') || 0);
      const player = { x: .5, y: .78, size: 18, speed: .48 };
      const hazards = [];
      const keys = new Set();
      let dragging = false;

      bestEl.textContent = String(best).padStart(3, '0');

      function resize() {
        const rect = board.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        width = rect.width; height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(55,102,232,.07)'; ctx.lineWidth = 1;
        const grid = 28;
        for (let x = grid; x < width; x += grid) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke(); }
        for (let y = grid; y < height; y += grid) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); }

        hazards.forEach(h => {
          ctx.fillStyle = '#d24d57';
          roundedRect(h.x * width - h.w/2, h.y * height - h.h/2, h.w, h.h, 5);
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          ctx.fillRect(h.x * width - h.w/2 + 5, h.y * height - 1, h.w - 10, 2);
        });

        const px = player.x * width, py = player.y * height;
        ctx.shadowColor = 'rgba(55,102,232,.28)'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#3766e8';
        roundedRect(px - player.size/2, py - player.size/2, player.size, player.size, 6);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
      }

      function spawn() {
        const size = 15 + Math.random() * 21;
        hazards.push({
          x: .07 + Math.random() * .86,
          y: -.08,
          w: size * (1.2 + Math.random() * 1.2),
          h: size,
          speed: .18 + Math.random() * .13 + Math.min(score, 70) * .0018
        });
      }

      function hit(h) {
        const px = player.x * width, py = player.y * height;
        const hx = h.x * width, hy = h.y * height;
        return Math.abs(px - hx) < (player.size + h.w) * .43 && Math.abs(py - hy) < (player.size + h.h) * .43;
      }

      function tick(now) {
        if (!running || paused) return;
        const dt = Math.min((now - last) / 1000 || 0, .035); last = now;
        elapsed += dt; spawnClock += dt;
        let dx = 0, dy = 0;
        if (keys.has('arrowleft') || keys.has('a')) dx--;
        if (keys.has('arrowright') || keys.has('d')) dx++;
        if (keys.has('arrowup') || keys.has('w')) dy--;
        if (keys.has('arrowdown') || keys.has('s')) dy++;
        if (dx && dy) { dx *= .707; dy *= .707; }
        player.x = Math.max(.035, Math.min(.965, player.x + dx * player.speed * dt));
        player.y = Math.max(.035, Math.min(.965, player.y + dy * player.speed * dt));

        const interval = Math.max(.27, .72 - score * .006);
        if (spawnClock >= interval) { spawnClock = 0; spawn(); }

        for (let i = hazards.length - 1; i >= 0; i--) {
          const h = hazards[i]; h.y += h.speed * dt;
          if (hit(h)) { endGame(); return; }
          if (h.y * height - h.h/2 > height) {
            hazards.splice(i, 1); score++;
            scoreEl.textContent = String(score).padStart(3, '0');
          }
        }
        draw(); raf = requestAnimationFrame(tick);
      }

      function startGame() {
        cancelAnimationFrame(raf);
        hazards.length = 0; keys.clear(); score = 0; elapsed = 0; spawnClock = .5;
        player.x = .5; player.y = .78;
        scoreEl.textContent = '000';
        overlay.hidden = true; running = true; paused = false;
        pauseBtn.textContent = 'Pause · P'; statusEl.textContent = 'In progress';
        last = performance.now(); board.focus(); draw(); raf = requestAnimationFrame(tick);
      }

      function endGame() {
        running = false; cancelAnimationFrame(raf);
        if (score > best) {
          best = score; localStorage.setItem('quiet-drift-best', best);
          bestEl.textContent = String(best).padStart(3, '0');
          kicker.textContent = 'New personal best';
        } else kicker.textContent = 'Round complete';
        title.textContent = `${score} notes cleared.`;
        message.textContent = score < 8 ? 'A nimble start. Try shorter taps near the edges.' : 'Nicely composed. The next round will begin at the same gentle pace.';
        startBtn.textContent = 'Play again'; overlay.hidden = false; statusEl.textContent = 'Ready';
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        if (paused) {
          cancelAnimationFrame(raf); statusEl.textContent = 'Paused'; pauseBtn.textContent = 'Resume · P';
          kicker.textContent = 'Paused'; title.textContent = 'Take your time.';
          message.textContent = 'Your round is exactly where you left it.'; startBtn.textContent = 'Resume'; overlay.hidden = false;
        } else {
          overlay.hidden = true; statusEl.textContent = 'In progress'; pauseBtn.textContent = 'Pause · P';
          last = performance.now(); board.focus(); raf = requestAnimationFrame(tick);
        }
      }

      startBtn.addEventListener('click', () => paused ? togglePause() : startGame());
      pauseBtn.addEventListener('click', togglePause);
      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)) { e.preventDefault(); keys.add(k); }
        if (k === 'p' || k === 'escape') { e.preventDefault(); togglePause(); }
        if ((k === 'enter' || k === ' ') && !running) { e.preventDefault(); startGame(); }
      });
      window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
      window.addEventListener('blur', () => { if (running && !paused) togglePause(); });

      document.querySelectorAll('[data-dir]').forEach(btn => {
        const dirKey = {left:'arrowleft',right:'arrowright',up:'arrowup',down:'arrowdown'}[btn.dataset.dir];
        const press = e => { e.preventDefault(); keys.add(dirKey); };
        const release = e => { e.preventDefault(); keys.delete(dirKey); };
        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('pointerleave', release);
      });

      function steer(e) {
        if (!running || paused) return;
        const rect = board.getBoundingClientRect();
        player.x = Math.max(.035, Math.min(.965, (e.clientX - rect.left) / rect.width));
        player.y = Math.max(.035, Math.min(.965, (e.clientY - rect.top) / rect.height));
      }
      board.addEventListener('pointerdown', e => {
        if (!running || paused) return;
        dragging = true; board.setPointerCapture(e.pointerId); steer(e);
      });
      board.addEventListener('pointermove', e => { if (dragging) steer(e); });
      board.addEventListener('pointerup', e => { dragging = false; board.releasePointerCapture(e.pointerId); });
      board.addEventListener('pointercancel', () => { dragging = false; });

      new ResizeObserver(resize).observe(board);
    })();
  </script>
</body>
</html>
